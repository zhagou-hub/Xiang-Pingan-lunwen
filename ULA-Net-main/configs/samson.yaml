dataset: samson
seed: 42
prefer_cuda: true

# Paper-aligned
patch_size: 3
n_endmembers: 3
model_dim: 128
n_heads: 4
epsilon: 0.2

# Paper Table I (real)
alpha: 0.1
beta: 0.01

lr: 0.006
weight_decay: 0.0
epochs: 100
batch_size: 100
lr_step: 20
lr_gamma: 0.99
num_workers: 0
eval_batch_size: 256
n_vca_runs: 1
n_experiments: 10   # paper: ten full experiments, average metrics
mse_weight: 1.0

data_dir: data/raw/samson
output_root: outputs
